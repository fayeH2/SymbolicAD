dataset: mvtec_loco
category: ""
shot: 2
seed: 668
support_seed: 668
mode: baseline_logic
max_images_per_group: 0

model:
  clip_model: hf-hub:timm/vit_base_patch16_clip_224.openai
  device: cuda:0
  image_size: 448
  batch_size: 4
  logit_scale: 100.0
  baseline: clip_adaptive
  knn: 1
  max_bank_size: 0
  # Preserve aligned component coordinates instead of matching every query
  # patch against an orderless global support bank only.
  spatial_radius: 1
  spatial_weight: 0.5
  # PromptAD/AnomalyCLIP-style dense feature modelling.  Middle ViT blocks keep
  # local structure; optional whitening removes CLIP's shared dominant direction.
  feature_layers: [3, 8, 11]
  layer_fusion: mean
  local_radius: 1
  local_weight: 0.35
  whiten: false
  whiten_components: 128
  whiten_eps: 1.0e-3
  text_visual_weight: 0.0
  text_visual_fusion: harmonic
  foreground_masking: true
  foreground_soft: 0.35
  # Support-calibrated top-k image statistic.  Top-1% is used for the
  # multi-layer map; top-5% is more robust for the projected fallback.
  image_score_percent: 1.0
  image_text_weight: 0.1
  image_global_weight: 0.0
  # Strict 2-shot FSAD uses a fixed feature source. "auto" inspects the query
  # score distribution and is permitted only when evaluation.allow_transductive
  # is explicitly enabled for a separately reported transductive ablation.
  feature_source: both
  projected_weight: 0.25
  auto_select_samples: 120
  # Only leave the simple projected baseline when a more complex candidate is
  # clearly more separable (relative Otsu margin).  This keeps small-object
  # categories on the stable projected space.
  auto_margin: 0.08
  normalise_layers: false

grounding:
  alpha: 0.5
  component_threshold: 0.55
  # Component extraction runs on a 14x14 grid; 8 patches erases small labels.
  min_instance_area: 2
  # The CLIP grid is only 14x14; a 3x3 opening erases small normal labels.
  morphology_kernel: 1
  support_quantile_low: 0.50
  support_quantile_high: 0.99
  max_prototypes_per_component: 32
  text_embedding_cache: true

logic:
  count_sigma: 1.0
  ratio_sigma: 0.25
  lambda_feature: 0.3
  lambda_relation: 0.5
  lambda_pair_prompt: 0.2
  dummy_match_cost: 0.5
  spatial_temperature: 1.0
  eta: 0.5
  rescore_temperature: 0.07
  color_sigma: 0.18
  fail_threshold: 0.5
  and_epsilon: 1.0e-6
  rescore_enabled: false
  support_calibration: true
  min_atom_support_truth: 0.55
  heatmap_sigma: 0.8
  soft_responsibility: true
  calibration_min_gap: 0.10
  attribute_min_gap: 0.05

qwen:
  enabled: true
  model_path: /home/hjh/AgentModels/Qwen3-VL-8B-Thinking
  device: cuda:1
  max_new_tokens: 3000
  max_image_side: 768
  cache_subdir: qwen_rules
  allow_template_fallback: false

compiler:
  enabled: true
  deduplicate: true
  drop_implied_exist: true
  drop_redundant_one_to_one: true
  repair_counts: false
  repair_relation_direction: false
  add_missing_counts: false
  disable_inconsistent_atoms: true
  stable_count_std: 0.5
  count_in_range_sigma: 1.0
  max_count_range_width: 6
  min_attribute_support_score: 0.05

fusion:
  # Pixel fusion is attempted only when support/query calibration passes;
  # otherwise the symbolic branch abstains.  The image residual is controlled
  # by image_logic_weight below.
  lambda_logic: 0.25
  beta: 0.0
  topk_percent: 1.0
  map_epsilon: 1.0e-6
  # Scale the above by support-estimated reliability; unreliable rule banks
  # automatically abstain instead of damaging the baseline.
  auto_from_support: true
  min_reliability: 0.55
  min_coverage: 0.35
  max_support_logic_noise: 0.12
  image_logic_weight: 0.02
  image_logic_scale: 1.0
  max_support_image_noise: 0.30

# Mentor-proposed segment-first supplement. All thresholds and MoE gates are
# fitted from the normal support images only; it never tunes on query labels or
# the query score distribution.
symbolicdet:
  enabled: true
  analysis_size: 128
  color_clusters: 4
  grid_rows: 4
  grid_cols: 4
  min_segment_area_ratio: 0.0015
  max_segments: 48
  foreground_color_distance: 0.08
  morphology_kernel: 3
  relative_margin: 0.15
  occupancy_margin: 0.04
  color_margin: 0.06
  position_margin: 0.06
  count_margin: 0.5
  violation_temperature: 1.0
  expert_top_k: 2
  appearance_weight: 0.40
  structure_weight: 0.35
  relation_weight: 0.25
  fusion_weight: 0.25
  image_weight: 0.05
  min_expression_confidence: 0.10

evaluation:
  pixel_eval_size: 256
  pixel_max_points: 4000000
  pro_fpr_limit: 0.30
  pro_thresholds: 64
  enable_pro: true
  allow_transductive: false

output:
  save_maps: true
  map_dtype: float16
  save_visualizations: true
  save_traces: true
  save_predictions: true
  timestamped: true
  method_name: SymbolicAD
  image_size: 400
  save_reference_images: true

paths:
  data_root: /home/hjh/Desktop/0Datasets/anomaly/industrial/MVTecLOCO/MVTecLOCO
  cache_dir: cache
  results_dir: results
  clip_cache_dir: /home/hjh/.cache/huggingface/hub
